# data + graph: come from configs/dataset/<name>.yaml (see --dataset), merged in
# right after this file.

split:
  train_ratio: 0.7
  val_ratio: 0.1
  test_start_date: null  # e.g. "2022-01-01" — overrides ratio-based test-set boundary

window:
  name: w12_h12
  seq_len: 12
  label_len: 6
  pred_len: 12
  test_stride: 1  # >1 strides through non-overlapping test windows to cut eval cost

task:
  name: multivariate
  features_mode: MS

dataloader:
  batch_size: 64
  num_workers: 0
  pad_to: 0

transforms:
  order: [log, clip, zscore, pca]

  log:
    enabled: true
    mode: log1p
    apply_to:
      target: true
      continuous_features: true

  clip:
    enabled: false
    method: quantile
    apply_to:
      target: false
      continuous_features: true
    quantile:
      lower: 0.001
      upper: 0.999

  zscore:
    enabled: true
    scope: global
    eps: 1.0e-6
    apply_to:
      target: true
      continuous_features: true

  pca:
    enabled: false
    n_components: 16

model:
  name: repeat
  hparams: {}

run:
  device: cuda
  max_eval_batches: 0
