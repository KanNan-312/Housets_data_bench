# Template config for the full HouseTS dataset (data/raw/HouseTS.csv).
# Not usable until that file is present locally — see README.md for the
# download link. Adjust feature_cols/drop_cols once the file is in place.
dataset:
  name: redfin_metro_house

data:
  path: /home/triho/Data/Time_Series_Research/ST-Collaboration/data/redfin_metro_house/redfin_metro_house.csv
  time_col: date
  id_col: metro
  target_col: median_sale_price
  feature_cols: [homes_sold,median_days_on_market,new_listings,active_listings,pending_sales,inventory,average_sale_to_list_ratio,median_new_listing_price]
  drop_cols: []
  freq: M   # monthly
  impute: true
  n_zip: 0

graph:
  # path to a graph.npz file with 'A' ([N,N] adjacency matrix) and 'ids'
  # (length-N array of region ids giving A's row/col order) — required by GNN
  # models. See scripts/build_knn_graph.py for a standalone builder.
  path: data/seattle_house/graph.npz

split:
  train_ratio: 0.7
  val_ratio: 0.1
  test_start_date: "2025-01-31"  # e.g. "2022-01-01" — overrides ratio-based test-set boundary

window:
  seq_len: 36
  label_len: 12
  pred_len: 12
  test_stride: 3  # >1 strides through non-overlapping test windows to cut eval cost

transforms:
  log:
    enabled: false
    mode: log1p
    apply_to:
      target: true
      continuous_features: true

  clip:
    enabled: false
    method: quantile
    apply_to:
      target: false
      continuous_features: true
    quantile:
      lower: 0.001
      upper: 0.999

  zscore:
    enabled: false
    scope: global
    eps: 1.0e-6
    apply_to:
      target: true
      continuous_features: true