dataset:
  name: dc_house

data:
  path: data/DC_House.csv
  id_col: zipcode
  time_col: date
  target_col: price
  # explicit covariate columns — the loader reads/models only these + target_col.
  # set to null to fall back to auto-inferring all numeric columns instead.
  feature_cols:
    - median_sale_price
    - median_list_price
    - homes_sold
    - pending_sales
    - new_listings
    - inventory
    - median_dom
    - avg_sale_to_list
    - Total Population
  drop_cols: [city, metro, state, latitude, longitude]
  freq: M   # monthly
  impute: true
  n_zip: 0  # 0 => use all ZIPs

graph:
  # path to a graph.npz file with 'A' ([N,N] adjacency matrix) and 'ids'
  # (length-N array of region ids giving A's row/col order) — required by GNN
  # models (gcn_tcn, graph_wavenet, stgcn, stsgcn, stllm_plus). See
  # scripts/build_knn_graph.py for a standalone builder if you need one.
  path: null
